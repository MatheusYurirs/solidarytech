# Ambiente local: 2 Postgres + DynamoDB local + os 3 serviços.
# SQS fica desligado localmente (o donation-service o trata como opcional).
services:
  ngo-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: ngo_db }
    volumes: ["./ngo-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }

  donation-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: donation_db }
    volumes: ["./donation-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, retries: 20 }

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on: [dynamodb]
    environment: { AWS_ACCESS_KEY_ID: local, AWS_SECRET_ACCESS_KEY: local, AWS_DEFAULT_REGION: us-east-1 }
    entrypoint: ["sh", "-c"]
    command:
      - >
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done;
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 --table-name SolidaryTechVolunteers
        --attribute-definitions AttributeName=volunteer_id,AttributeType=S
        --key-schema AttributeName=volunteer_id,KeyType=HASH --billing-mode PAY_PER_REQUEST || true
    restart: "no"

  ngo-service:
    build: ./ngo-service
    depends_on: { ngo-db: { condition: service_healthy } }
    environment: { DATABASE_URL: "postgres://postgres:postgres@ngo-db:5432/ngo_db" }
    ports: ["8081:8081"]

  donation-service:
    build: ./donation-service
    depends_on: { donation-db: { condition: service_healthy } }
    environment: { DATABASE_URL: "postgres://postgres:postgres@donation-db:5432/donation_db?sslmode=disable" }
    ports: ["8082:8082"]

  volunteer-service:
    build: ./volunteer-service
    depends_on: [dynamodb-init]
    environment:
      AWS_DYNAMODB_TABLE: SolidaryTechVolunteers
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
    ports: ["8083:8083"]
