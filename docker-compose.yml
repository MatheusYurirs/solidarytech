# Ambiente local da SolidaryTech.
# Postgres (ngo_db e donation_db), DynamoDB Local e ElasticMQ (SQS compatível).
# Uso: docker compose up -d --build && ./local/smoke-test.sh

name: solidarytech

x-aws-local: &aws-local
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solidary
      POSTGRES_PASSWORD: solidary
    ports:
      - "5432:5432"
    volumes:
      - ./local/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./ngo-service/db/init.sql:/sql/ngo.sql:ro
      - ./donation-service/db/init.sql:/sql/donation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidary -d donation_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb
    environment:
      <<: *aws-local
    entrypoint: ["/bin/sh", "/init/dynamodb-init.sh"]
    volumes:
      - ./local/dynamodb-init.sh:/init/dynamodb-init.sh:ro

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro

  ngo-service:
    build: ./ngo-service
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://solidary:solidary@postgres:5432/ngo_db
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  donation-service:
    build: ./donation-service
    environment:
      <<: *aws-local
      PORT: "8082"
      DATABASE_URL: postgres://solidary:solidary@postgres:5432/donation_db?sslmode=disable
      AWS_SQS_URL: http://elasticmq:9324/000000000000/solidary-donations
      AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  volunteer-service:
    build: ./volunteer-service
    environment:
      <<: *aws-local
      PORT: "8083"
      AWS_DYNAMODB_TABLE: SolidaryTechVolunteers
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
    ports:
      - "8083:8083"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
